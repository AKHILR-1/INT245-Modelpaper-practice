<head>

    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --success: #27ae60;
            --error: #c0392b;
            --info: #2980b9;
            --background: #f8f9fa;
            --card-bg: #ffffff;
            --text: #333333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }
        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 2.5rem 1rem;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        header h1 { margin: 0; font-size: 2.2rem; letter-spacing: 1px; }
        header p { margin: 0.5rem 0 0 0; opacity: 0.9; font-size: 1.1rem; }
        
        .container {
            max-width: 950px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* Report Card Dashboard */
        .report-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.8rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-bottom: 2.5rem;
            border: 3px solid var(--primary);
            position: sticky;
            top: 15px;
            z-index: 100;
        }
        .report-card h2 {
            margin-top: 0;
            color: var(--primary);
            border-bottom: 2px solid #eaeded;
            padding-bottom: 0.6rem;
            font-size: 1.5rem;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1.2rem;
            text-align: center;
            margin-top: 1.2rem;
        }
        .metric-box {
            padding: 1rem;
            background: #f1f2f6;
            border-radius: 8px;
            font-weight: 700;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
        }
        .metric-box .value {
            font-size: 1.8rem;
            display: block;
            margin-top: 0.3rem;
        }
        .metric-box.score { color: var(--info); border-bottom: 5px solid var(--info); }
        .metric-box.correct-cnt { color: var(--success); border-bottom: 5px solid var(--success); }
        .metric-box.wrong-cnt { color: var(--error); border-bottom: 5px solid var(--error); }
        .metric-box.accuracy { color: #f39c12; border-bottom: 5px solid #f39c12; }
        .metric-box.progress { color: #7f8c8d; border-bottom: 5px solid #7f8c8d; }

        .question-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 1.8rem;
            margin-bottom: 2.5rem;
            box-shadow: 0 3px 10px rgba(0,0,0,0.04);
            border-left: 6px solid #bdc3c7;
            transition: all 0.25s ease;
        }
        .question-card.correct { border-left-color: var(--success); }
        .question-card.wrong { border-left-color: var(--error); }
        
        .question-num {
            font-weight: 700;
            color: var(--primary);
            font-size: 0.95rem;
            text-transform: uppercase;
            margin-bottom: 0.6rem;
            border-bottom: 1px dashed #e2e8f0;
            padding-bottom: 0.4rem;
        }
        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.2rem;
            color: #2c3e50;
        }
        .options-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .option-item {
            margin-bottom: 0.9rem;
        }
        .option-btn {
            width: 100%;
            text-align: left;
            padding: 0.9rem 1.2rem;
            background-color: #f8f9fa;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
            color: #2f3542;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #e4e7eb;
            border-color: #a5b1c2;
        }
        .option-btn:disabled { cursor: not-allowed; }
        
        .option-btn.selected-correct {
            background-color: #d4edda !important;
            border-color: var(--success) !important;
            color: #155724;
            font-weight: 700;
        }
        .option-btn.selected-wrong {
            background-color: #f8d7da !important;
            border-color: var(--error) !important;
            color: #721c24;
        }
        .option-btn.show-correct {
            background-color: #d4edda !important;
            border-color: var(--success) !important;
            color: #155724;
        }
        
        /* Masterclass Detailed Explanation Box */
        .explanation-box {
            margin-top: 1.5rem;
            padding: 1.2rem;
            background-color: #fdfefe;
            border-radius: 6px;
            border: 1px solid #dcdde1;
            border-top: 4px solid var(--secondary);
            display: none;
        }
        .explanation-box h4 { 
            margin: 0 0 0.8rem 0; 
            color: var(--primary); 
            font-size: 1.1rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 0.3rem;
        }
        .explanation-section {
            margin-bottom: 0.8rem;
            font-size: 0.98rem;
        }
        .explanation-section strong {
            color: #2c3e50;
        }
        .explanation-box ul {
            margin: 0.4rem 0 0 0;
            padding-left: 1.3rem;
        }
        .explanation-box li {
            margin-bottom: 0.4rem;
            font-size: 0.93rem;
        }
    </style>
</head>

let correctCount = 0;
let wrongCount = 0;
let totalScore = 0;
const answeredQuestions = new Set();

function buildQuiz() {
    const container = document.getElementById('quiz-container');
    
    questionsData.forEach((q) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `q-card-${q.num}`;
        
        let optionsHTML = '';
        for (const [key, val] of Object.entries(q.options)) {
            optionsHTML += `
                <li class="option-item">
                    <button class="option-btn" data-qnum="${q.num}" data-opt="${key}" onclick="checkAnswer(${q.num}, '${key}')">
                        <strong>(${key.toUpperCase()})</strong> ${val}
                    </button>
                </li>
            `;
        }
        
        // Render explicit details loop
        let wrongOptionsHTML = q.exp.others.map(item => `<li>${item}</li>`).join('');
        
        card.innerHTML = `
            <div class="question-num">Question ${q.num} <span style="float:right; font-weight:normal; color:#7f8c8d; font-size:0.85rem;">[${q.co_rbt}]</span></div>
            <div class="question-text">${q.text}</div>
            <ul class="options-list">${optionsHTML}</ul>
            <div class="explanation-box" id="exp-${q.num}">
                <h4>🎯 Masterclass Breakdown</h4>
                <div class="explanation-section">
                    <strong>Why Option (${q.correct.toUpperCase()}) is Correct:</strong>
                    <p style="margin: 0.3rem 0; padding-left: 5px; border-left: 3px solid var(--success); font-style: italic;">${q.exp.correct}</p>
                </div>
                <div class="explanation-section" style="margin-top: 1rem;">
                    <strong>Why the Alternative Options are Incorrect:</strong>
                    <ul>${wrongOptionsHTML}</ul>
                </div>
            </div>
        `;
        
        container.appendChild(card);
    });
}

function checkAnswer(qNum, selectedOpt) {
    if (answeredQuestions.has(qNum)) return;
    answeredQuestions.add(qNum);
    
    const q = questionsData.find(item => item.num === qNum);
    const card = document.getElementById(`q-card-${qNum}`);
    const expBox = document.getElementById(`exp-${qNum}`);
    const buttons = card.querySelectorAll('.option-btn');
    
    buttons.forEach(btn => btn.disabled = true);
    
    if (selectedOpt === q.correct) {
        correctCount++;
        totalScore += 1;
        card.classList.add('correct');
        card.querySelector(`[data-opt="${selectedOpt}"]`).classList.add('selected-correct');
    } else {
        wrongCount++;
        card.classList.add('wrong');
        card.querySelector(`[data-opt="${selectedOpt}"]`).classList.add('selected-wrong');
        card.querySelector(`[data-opt="${q.correct}"]`).classList.add('show-correct');
    }
    
    // Update live report stats
    const totalAnswered = correctCount + wrongCount;
    const accuracyRate = totalAnswered > 0 ? Math.round((correctCount / totalAnswered) * 100) : 0;
    
    document.getElementById('card-progress').innerText = `${totalAnswered} / 60`;
    document.getElementById('card-correct').innerText = correctCount;
    document.getElementById('card-wrong').innerText = wrongCount;
    document.getElementById('card-score').innerText = `${totalScore} / 60`;
    document.getElementById('card-accuracy').innerText = `${accuracyRate}%`;
    
    // Instant reveal block
    expBox.style.display = 'block';
}

window.onload = buildQuiz;
</script>
